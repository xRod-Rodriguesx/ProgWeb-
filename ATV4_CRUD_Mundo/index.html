<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CRUD Mundo Geográfico</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f4f4f9; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #0056b3; }
    input { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .card { border: 1px solid #ddd; padding: 15px; margin-top: 15px; border-radius: 4px; background: #fafafa; }
    hr { border: 1px solid #eee; margin: 20px 0; }
  </style>
</head>
<body>

<div class="container" id="loginScreen">
  <h2>Login - Sistema Geográfico</h2>
  <p>Digite qualquer credencial para entrar (Simulação de Login)</p>
  <input type="text" id="user" placeholder="Usuário (ex: admin)">
  <input type="password" id="pass" placeholder="Senha (ex: admin)">
  <button onclick="login()">Entrar no Sistema</button>
</div>

<div class="container hidden" id="dashboard">
  <h2>Painel de Controle Geográfico</h2>
  
  <div class="card">
    <h3>🌍 Cadastrar Novo Continente</h3>
    <input type="text" id="contNome" placeholder="Nome do Continente (ex: América do Sul)">
    <input type="text" id="contDesc" placeholder="Descrição rápida">
    <button onclick="salvarContinente()">Salvar no Banco</button>
  </div>

  <div class="card">
    <h3>🔍 Enriquecimento de Dados (API Externa)</h3>
    <p>Consulte dados oficiais e a bandeira de qualquer país.</p>
    <input type="text" id="paisBusca" placeholder="Nome do País em Inglês (ex: Brazil, Japan, Germany)">
    <button onclick="buscarPais()">Consultar API</button>
    <div id="resultadoApi" class="card hidden"></div>
  </div>

  <div class="card">
    <h3>📋 Continentes Cadastrados</h3>
    <button onclick="listarContinentes()">Atualizar Lista</button>
    <div id="lista" style="margin-top: 15px;"></div>
  </div>
</div>

<script>
  // Aponta para o servidor Node/Prisma que acabamos de configurar
  const API_URL = 'http://localhost:3000';

  function login() {
    const user = document.getElementById('user').value;
    if(user.trim() !== '') {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      listarContinentes();
    } else {
      alert('Por favor, insira um usuário!');
    }
  }

  async function salvarContinente() {
    const nome = document.getElementById('contNome').value;
    const descricao = document.getElementById('contDesc').value;
    
    try {
      await fetch(`${API_URL}/continentes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, descricao })
      });
      alert('Continente salvo com sucesso!');
      document.getElementById('contNome').value = '';
      document.getElementById('contDesc').value = '';
      listarContinentes();
    } catch (error) {
      alert('Erro ao salvar. Verifique se o servidor está rodando!');
    }
  }

  async function listarContinentes() {
    try {
      const res = await fetch(`${API_URL}/continentes`);
      const data = await res.json();
      const divLista = document.getElementById('lista');
      
      if(data.length === 0) {
        divLista.innerHTML = '<p>Nenhum continente cadastrado ainda.</p>';
        return;
      }
      
      divLista.innerHTML = data.map(c => `<p><b>${c.nome}</b>: ${c.descricao}</p>`).join('');
    } catch (error) {
      document.getElementById('lista').innerHTML = '<p style="color:red;">Falha ao conectar com o servidor.</p>';
    }
  }

  async function buscarPais() {
    const nome = document.getElementById('paisBusca').value;
    try {
      const res = await fetch(`${API_URL}/api/pais/${nome}`);
      if(res.ok) {
        const data = await res.json();
        const div = document.getElementById('resultadoApi');
        div.innerHTML = `
          <h4>${data.name.common} (${data.cca2})</h4>
          <p><b>Capital:</b> ${data.capital ? data.capital[0] : 'N/A'}</p>
          <p><b>Região:</b> ${data.region}</p>
          <img src="${data.flags.png}" alt="Bandeira" width="150" style="border: 1px solid #ccc; margin-top: 10px;">
        `;
        div.classList.remove('hidden');
      } else {
        alert('País não encontrado na base de dados internacional.');
      }
    } catch (error) {
      alert('Erro ao buscar dados na API.');
    }
  }
</script>
</body>
</html>
